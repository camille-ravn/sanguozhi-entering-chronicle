name: Build Android APK

# 云端自动编译安装包：不用在本机装 JDK / Android SDK。
# 触发方式：① 手动——仓库 Actions 页选 “Build Android APK” → Run workflow；
#           ② 自动——推送到 main 且改动涉及网页或 mobile/ 时。
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "data.js"
      - "wiki-bios.js"
      - "reading.js"
      - "reading-texts.js"
      - "cloud-config.js"
      - "mobile/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Sync web assets into www
        working-directory: mobile
        run: npm run sync:web

      - name: Add Android platform
        working-directory: mobile
        run: npx cap add android

      - name: Capacitor sync
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sanguozhi-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
